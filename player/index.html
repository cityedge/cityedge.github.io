<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>Suno Stream Player（単体HTML）</title>
    <style>
      :root {
        --bg: #101216;
        --panel: #1a1d23;
        --panel-border: #2a2e36;
        --text: #e8eaed;
        --text-dim: #9aa0a8;
        --accent: #e8734a;
        --accent-hover: #f0825e;
        --danger: #e05a5a;
        --radius: 14px;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
      }
      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 20px 16px 40px;
      }

      /* --- add form --- */
      .add-form {
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: var(--radius);
        padding: 14px;
        margin-bottom: 22px;
      }
      .add-form .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .add-form input {
        background: #0c0e11;
        border: 1px solid var(--panel-border);
        border-radius: 9px;
        color: var(--text);
        font-size: 14px;
        padding: 10px 12px;
        min-width: 0;
      }
      .add-form input::placeholder { color: #6b7078; }
      .add-form input:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
      #song-input { flex: 1 1 220px; }
      #title-input { flex: 0 1 170px; }
      .add-btn {
        background: var(--accent);
        border: none;
        border-radius: 9px;
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        padding: 10px 18px;
        cursor: pointer;
        flex: 0 0 auto;
      }
      .add-btn:hover { background: var(--accent-hover); }
      .add-btn:active { transform: scale(0.97); }
      .form-msg {
        font-size: 13px;
        margin-top: 9px;
        min-height: 0;
        display: none;
      }
      .form-msg.error { color: var(--danger); display: block; }
      .form-msg.ok { color: #7bc47f; display: block; }

      /* --- song cards --- */
      .song { margin-bottom: 22px; }
      .song-head {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 8px;
        padding: 0 2px;
      }
      .song-title {
        font-size: 15px;
        font-weight: 600;
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .take-label {
        color: var(--text-dim);
        font-size: 12px;
        font-weight: 400;
        margin-left: 6px;
        white-space: nowrap;
      }
      .icon-btn {
        background: none;
        border: none;
        color: var(--text-dim);
        font-size: 17px;
        line-height: 1;
        width: 32px;
        height: 32px;
        border-radius: 8px;
        cursor: pointer;
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .icon-btn:hover { background: var(--panel); color: var(--text); }
      .icon-btn.remove:hover { color: var(--danger); }
      .embed-wrap {
        border-radius: var(--radius);
        overflow: hidden;
        background: #000;
        line-height: 0;
      }
      .embed-wrap iframe {
        width: 100%;
        height: 240px;
        border: 0;
        display: block;
      }
      .empty {
        color: var(--text-dim);
        font-size: 14px;
        text-align: center;
        padding: 36px 0 8px;
      }

      @media (max-width: 520px) {
        main { padding: 14px 10px 32px; }
        #title-input { flex: 1 1 100%; }
        .embed-wrap iframe { height: 240px; }
      }
    </style>
  </head>
  <body>
    <main>
      <form class="add-form" id="add-form" autocomplete="off">
        <div class="row">
          <input id="song-input" type="text" inputmode="url" placeholder="https://suno.com/song/… または曲ID" aria-label="Sunoの曲URLまたは曲ID" />
          <input id="title-input" type="text" placeholder="タイトル（任意）" aria-label="タイトル（任意）" />
          <button class="add-btn" type="submit">追加</button>
        </div>
        <p class="form-msg" id="form-msg" role="status"></p>
      </form>

      <div id="list"></div>
      <p class="empty" id="empty" hidden>曲がありません。上の欄にSunoの曲URLか曲IDを貼って追加してください。</p>
    </main>

    <script>
      (function () {
        'use strict';

        var DEFAULT_SONGS = [
          { id: '52c6d17b-00b6-4412-8b86-b9115b82406d', title: '秋の日曜日' },
          { id: '290be129-3289-4412-babc-37b3d903acd3', title: '窓辺の日曜の午後' }
        ];

        var UUID_RE = /^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$/;

        // Accept: bare UUID, https://suno.com/song/<UUID>, https://suno.com/embed/<UUID>
        // (with optional www., trailing slash, query or fragment). Anything else -> null.
        function parseSongId(raw) {
          if (typeof raw !== 'string') return null;
          var s = raw.trim();
          if (!s) return null;
          if (UUID_RE.test(s)) return s.toLowerCase();
          var m = s.match(/^https?:\/\/(?:www\.)?suno\.com\/(?:song|embed)\/([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})(?:[/?#].*)?$/);
          if (m) return m[1].toLowerCase();
          return null;
        }

        var songs = [];

        function addSong(id, title) {
          for (var i = 0; i < songs.length; i++) {
            if (songs[i].id === id) return false; // dedupe
          }
          songs.push({ id: id, title: (title || '').trim() });
          return true;
        }

        // Initial playlist: defaults, then ?songs=&titles= from the URL.
        DEFAULT_SONGS.forEach(function (s) { addSong(s.id, s.title); });
        try {
          var params = new URLSearchParams(window.location.search);
          var qSongs = params.get('songs');
          if (qSongs) {
            var qTitles = (params.get('titles') || '').split(',');
            qSongs.split(',').forEach(function (piece, i) {
              var id = parseSongId(piece);
              if (id) addSong(id, (qTitles[i] || '').trim());
            });
          }
        } catch (e) { /* ignore malformed query */ }

        var listEl = document.getElementById('list');
        var emptyEl = document.getElementById('empty');

        function makeIframe(id) {
          var f = document.createElement('iframe');
          f.src = 'https://suno.com/embed/' + id;
          f.title = 'Suno プレイヤー';
          f.setAttribute('allow', 'autoplay; encrypted-media; fullscreen');
          f.setAttribute('loading', 'lazy');
          f.setAttribute('referrerpolicy', 'no-referrer-when-downgrade');
          return f;
        }

        function render() {
          listEl.innerHTML = '';
          emptyEl.hidden = songs.length > 0;

          // Count duplicate display titles for Take labels.
          var counts = {};
          songs.forEach(function (s) {
            var key = s.title || s.id;
            counts[key] = (counts[key] || 0) + 1;
          });
          var seen = {};

          songs.forEach(function (song) {
            var key = song.title || song.id;
            seen[key] = (seen[key] || 0) + 1;

            var card = document.createElement('section');
            card.className = 'song';

            var head = document.createElement('div');
            head.className = 'song-head';

            var titleEl = document.createElement('span');
            titleEl.className = 'song-title';
            titleEl.textContent = song.title || '無題';
            if (counts[key] > 1) {
              var take = document.createElement('span');
              take.className = 'take-label';
              take.textContent = 'Take ' + seen[key];
              titleEl.appendChild(take);
            }
            head.appendChild(titleEl);

            var reloadBtn = document.createElement('button');
            reloadBtn.type = 'button';
            reloadBtn.className = 'icon-btn';
            reloadBtn.textContent = '↻';
            reloadBtn.title = '読み込み直し';
            reloadBtn.setAttribute('aria-label', '読み込み直し');
            head.appendChild(reloadBtn);

            var removeBtn = document.createElement('button');
            removeBtn.type = 'button';
            removeBtn.className = 'icon-btn remove';
            removeBtn.textContent = '×';
            removeBtn.title = '削除';
            removeBtn.setAttribute('aria-label', '削除');
            head.appendChild(removeBtn);

            var wrap = document.createElement('div');
            wrap.className = 'embed-wrap';
            wrap.appendChild(makeIframe(song.id));

            reloadBtn.addEventListener('click', function () {
              wrap.innerHTML = '';
              wrap.appendChild(makeIframe(song.id));
            });
            removeBtn.addEventListener('click', function () {
              var idx = songs.indexOf(song);
              if (idx >= 0) songs.splice(idx, 1);
              render();
            });

            card.appendChild(head);
            card.appendChild(wrap);
            listEl.appendChild(card);
          });
        }

        render();

        // --- add form ---
        var form = document.getElementById('add-form');
        var songInput = document.getElementById('song-input');
        var titleInput = document.getElementById('title-input');
        var msg = document.getElementById('form-msg');

        function showMsg(text, kind) {
          msg.textContent = text;
          msg.className = 'form-msg ' + kind;
        }

        form.addEventListener('submit', function (ev) {
          ev.preventDefault();
          var id = parseSongId(songInput.value);
          if (!id) {
            showMsg('Sunoの曲URL（https://suno.com/song/…）か曲IDを入力してください。', 'error');
            return;
          }
          if (!addSong(id, titleInput.value)) {
            showMsg('その曲はすでに追加されています。', 'error');
            return;
          }
          songInput.value = '';
          titleInput.value = '';
          showMsg('追加しました。', 'ok');
          render();
        });
      })();
    </script>
  </body>
</html>
